[package]
name = "ump-stream"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
authors = ["Cristian Zmole"]
description = "Universal Media Protocol: protobuf requests, chunked UMP part streams, server-driven ABR sessions"
license = "0BSD"
repository = "https://github.com/ZmoleCristian/ump-stream"
readme = "README.md"
keywords = ["ump", "sabr", "streaming", "protobuf", "media"]
categories = ["network-programming", "multimedia::encoding", "parser-implementations"]
exclude = ["tests/fixtures/real/", "examples/decode_sabr.rs", "examples/dump_structure.rs"]

[lib]
name = "ump_stream"

[dependencies]
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
